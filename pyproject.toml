[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-story-channel"
version = "0.4.0"
description = "Modular story video production foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "pydantic>=2.10,<3", "openai>=2.54,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2", "pillow>=11,<13", "numpy>=2.3,<3", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "streamlit>=1.66,<2"]
legacy = ["streamlit>=1.66,<2"]

[project.scripts]
story-channel = "story_channel.cli:main"

[tool.setuptools]
packages = ["backend", "backend.models", "backend.routers", "backend.services", "backend.workers", "backend.legacy_ui", "story_channel"]
package-dir = {"story_channel" = "backend/services/story_channel"}

[tool.pytest.ini_options]
pythonpath = ["backend/services", "."]
testpaths = ["tests"]
