<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="798" viewBox="0 0 1280 798" role="img">
<title>Assets | Reusable world-owned library</title><desc>No complete-assets stage. Unused drafts never block an episode; actual scene references are checked when used.</desc>
